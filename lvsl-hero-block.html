<!-- LVSL Hero Block — paste into Lofty HTML block editor -->
<style>
  .lvsl-hero {
    position: relative;
    width: 100%;
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background-image: url('https://images.unsplash.com/photo-1449844908441-8829872d2607?w=1600&q=80');
    background-size: cover;
    background-position: center;
    font-family: 'Georgia', serif;
  }
  .lvsl-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 70%, transparent 100%);
  }
  .lvsl-hero-content {
    position: relative;
    z-index: 2;
    padding: 4rem 5rem;
    max-width: 680px;
  }
  .lvsl-hero-headline {
    font-size: clamp(2.8rem, 5vw, 4.5rem);
    font-weight: 400;
    color: #ffffff;
    line-height: 1.1;
    margin: 0 0 1.25rem 0;
    letter-spacing: -0.01em;
  }
  .lvsl-hero-headline span {
    display: block;
  }
  .lvsl-hero-sub {
    font-family: 'Arial', sans-serif;
    font-size: clamp(1rem, 1.8vw, 1.15rem);
    color: rgba(255,255,255,0.82);
    line-height: 1.7;
    margin: 0 0 2.5rem 0;
    font-weight: 300;
    max-width: 480px;
  }
  .lvsl-hero-btns {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .lvsl-btn-primary {
    display: inline-block;
    background: #ffffff;
    color: #1a1a1a;
    text-decoration: none;
    padding: 0.85rem 2.2rem;
    font-family: 'Arial', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: background 0.25s, color 0.25s;
  }
  .lvsl-btn-primary:hover {
    background: #c9a96e;
    color: #fff;
  }
  .lvsl-btn-outline {
    display: inline-block;
    background: transparent;
    color: #ffffff;
    text-decoration: none;
    padding: 0.85rem 2.2rem;
    font-family: 'Arial', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 2px solid rgba(255,255,255,0.7);
    transition: background 0.25s, border-color 0.25s;
  }
  .lvsl-btn-outline:hover {
    background: rgba(255,255,255,0.15);
    border-color: #fff;
  }
  @media (max-width: 640px) {
    .lvsl-hero-content { padding: 3rem 1.5rem; }
    .lvsl-hero { min-height: 75vh; }
  }
</style>

<section class="lvsl-hero">
  <div class="lvsl-hero-content">
    <h1 class="lvsl-hero-headline">
      <span>Rooted in</span>
      <span>San Francisco.</span>
    </h1>
    <p class="lvsl-hero-sub">Real estate isn't just about property — it's about people, purpose, and the journey forward.</p>
    <div class="lvsl-hero-btns">
      <a href="#listings" class="lvsl-btn-primary">View Listings</a>
      <a href="#contact" class="lvsl-btn-outline">Meet the Team</a>
    </div>
  </div>
</section>
